services:
  api-one:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-one:local
    container_name: api-one
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Local mode with full multi-Gateway support (default). See
      # .env.example for every supported variable, including how to run
      # this in hosted/APP_MODE=hosted mode instead.
      APP_MODE: local
      PORT: 3000
    volumes:
      # Persists Gateway profile metadata (name/host/port/protocol - never
      # credentials, which only ever live in memory for the process
      # lifetime) across container restarts.
      - gateway-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
